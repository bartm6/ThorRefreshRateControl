plugins { id 'com.android.application' }

// Use a persistent key for public releases when the four environment variables
// are provided. Otherwise, allow an installable, debug-signed test artifact.
def signingEnv = [
        file: System.getenv('THOR_KEYSTORE_FILE'),
        password: System.getenv('THOR_KEYSTORE_PASSWORD'),
        alias: System.getenv('THOR_KEY_ALIAS'),
        keyPassword: System.getenv('THOR_KEY_PASSWORD')
]
def suppliedSigningValues = signingEnv.values().count { it != null && !it.isEmpty() }
if (suppliedSigningValues != 0 && suppliedSigningValues != signingEnv.size()) {
    throw new GradleException('Incomplete signing configuration: set all four THOR signing variables.')
}
def hasReleaseKey = suppliedSigningValues == signingEnv.size()

android {
    namespace 'com.thor.refreshrate'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thor.refreshrate'
        minSdk 30
        targetSdk 33
        versionCode 20
        versionName '1.0.2'
    }

    signingConfigs {
        if (hasReleaseKey) {
            production {
                storeFile file(signingEnv.file)
                storePassword signingEnv.password
                keyAlias signingEnv.alias
                keyPassword signingEnv.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // Shrink and optimize the application and transitive Java libraries.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')

            // The AYN Thor uses ARM64. Keep all ABIs in debug builds for development.
            ndk { abiFilters 'arm64-v8a' }

            // A real key is used automatically when configured. The fallback
            // creates an installable test APK, NOT a consistently signed update.
            signingConfig hasReleaseKey ? signingConfigs.production : signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // Compress native ADB libraries for a smaller GitHub download.
            // Android extracts them on install, increasing installed disk usage.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// These are required for the existing on-device wireless ADB pairing flow.
// Conscrypt's own consumer keep rules protect its JNI/reflective entry points.
dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
